<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あの夏、君と走った。</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e9;color:#363441;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:700px;margin:auto;padding:24px 18px}.sky{height:230px;border-radius:20px;background:linear-gradient(#9fbccf,#e6c4ad 70%,#8da997);position:relative;overflow:hidden}.sun{position:absolute;right:20%;top:28%;width:85px;height:85px;background:#fff0cf;border-radius:50%;box-shadow:0 0 45px #fff2d5}.ground{position:absolute;bottom:-85px;width:120%;left:-10%;height:145px;background:#668a7d;border-radius:50%}.sky span{position:absolute;bottom:20px;left:20px;color:white;font-size:12px;letter-spacing:.18em}h1{font-size:clamp(24px,6vw,36px);margin:24px 0 5px}.sub{font-size:13px;color:#817b81;margin-bottom:24px}.panel{background:#fffdf9;border:1px solid #e8dbd2;border-radius:18px;padding:24px;box-shadow:0 8px 30px #49372b0c}.chapter{font-size:12px;letter-spacing:.13em;color:#aa7868}.who{font-weight:bold;margin-top:22px}.text{white-space:pre-line;line-height:2.05;min-height:145px;margin-top:12px}.options{display:grid;gap:10px;margin-top:22px}button{border:1px solid #d8c9c0;background:white;border-radius:12px;padding:15px;text-align:left;font-size:15px;color:#393441;cursor:pointer}button:hover{background:#fff3ea;border-color:#ba8c7d}nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}nav button{font-size:13px;padding:9px 12px}.hidden{display:none}.cast{padding:14px 0;border-bottom:1px solid #eee1d9}.cast strong{display:block}.cast small{color:#807780}.memo{padding:12px;background:#f6efe8;border-radius:10px;margin:9px 0;font-size:14px}footer{text-align:center;color:#978b8c;font-size:12px;margin:24px}</style><main><div class="sky"><div class="sun"></div><div class="ground"></div><span>AO NAMI / GENERATIONS</span></div><h1>あの夏、君と走った。</h1><div class="sub">何気ない一日が、いつか誰かの記憶になる。</div><nav><button onclick="tab('game')">物語</button><button onclick="tab('characters')">登場人物</button><button onclick="tab('memories')">思い出</button></nav><section id="game" class="panel"><div class="chapter" id="chapter"></div><div class="who" id="who"></div><div class="text" id="text"></div><div class="options" id="options"></div></section><section id="characters" class="panel hidden"><div class="chapter">CHARACTERS</div><div class="cast"><strong>ハル / Haru</strong><small>主人公。まだ自分の夢を知らない。</small></div><div class="cast"><strong>ユナ / Yuna</strong><small>隣の席。明るいけれど、秘密がある。</small></div><div class="cast"><strong>レン / Ren</strong><small>幼なじみ。走ることが好き。</small></div><div class="cast"><strong>ルイ / Rui</strong><small>成績優秀。期待と自由の間で悩んでいる。</small></div><div class="cast"><strong>ミオ / Mio</strong><small>ハルの親。かつては夢を追う学生だった。</small></div></section><section id="memories" class="panel hidden"><div class="chapter">MEMORIES</div><div id="memoryList"></div><button onclick="if(confirm('思い出を消して最初から始めますか？')){localStorage.removeItem(K);location.reload()}">最初からやり直す</button></section><footer>無料プロローグ · セーブはこのブラウザ内</footer></main><script>const K='aonami-v1';let s;try{s=JSON.parse(localStorage.getItem(K))}catch{}if(!s||!Number.isInteger(s.i))s={i:0,m:[],flags:{}};const scenes=[{c:'2006年4月 · 入学式',w:'ナレーション',t:'新しい制服は、まだ少し大きい。\n窓の外で桜が散り始めていた。\n\n隣の席の子が、こちらを見て笑った。',o:[['自分から挨拶する','挨拶した春の日','hello'],['相手が話すのを待つ','言葉を待った春の日','quiet']]},{c:'第1話 · 隣の席',w:'ユナ',t:'「ねえ、部活、もう決めた？」\n\nユナは窓の外を指さした。\n「川沿いで走ってる人たち、知ってる？」',o:[['一緒に見に行こうと誘う','ユナを誘った放課後','invite'],['何の部活か聞く','川沿いの部活に興味を持った','ask']]},{c:'第1話 · 川沿い',w:'レン',t:'「ハル！こっち！」\n\n幼なじみのレンが手を振る。\n「泳いで、自転車に乗って、最後に走るんだって。トライアスロン！」',o:[['レンと少し走る','レンと走った川沿い','run'],['ユナと練習を眺める','ユナと見た夕暮れの練習','watch']]},{c:'第1話 · 帰り道',w:'ルイ',t:'「もう塾の時間だから」\n\nルイは教科書を抱えたまま、走る選手たちを見つめていた。\n「ちょっと、羨ましいな」',o:[['いつか一緒に走ろうと言う','ルイと交わした小さな約束','promise'],['無理しなくていいと伝える','ルイにかけた優しい言葉','kind']]},{c:'第1話 · 夜の食卓',w:'ミオ',t:'「学校はどうだった？」\n\n夕飯を並べながら、ミオが聞く。\n「部活もいいけど、勉強も大事だからね」',o:[['今日のことを話す','ミオに話した入学初日','share'],['うん、とだけ答える','話せなかった夜の気持ち','silent']]},{c:'PROLOGUE · END',w:'ナレーション',t:'明日も、いつもどおり学校がある。\n\nけれど今日交わした何気ない言葉は、何十年後にも残るかもしれない。\n\n青春は、まだ始まったばかり。',o:[['思い出を見る',null,'memories'],['もう一度始める',null,'restart']]}];function tab(x){for(const id of ['game','characters','memories'])document.getElementById(id).classList.toggle('hidden',x!==id);if(x==='memories')document.getElementById('memoryList').innerHTML=s.m.length?s.m.map(v=>'<div class="memo">'+v+'</div>').join(''):'<p>まだ思い出はありません。</p>'}function render(){const a=scenes[Math.min(s.i,5)];document.getElementById('chapter').textContent=a.c;document.getElementById('who').textContent=a.w;document.getElementById('text').textContent=a.t;const el=document.getElementById('options');el.replaceChildren();a.o.forEach(([label,m,flag])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(flag==='memories'){tab('memories');return}if(flag==='restart'){s={i:0,m:[],flags:{}}}else{if(m)s.m.push(m);s.flags['scene'+s.i]=flag;s.i++}localStorage.setItem(K,JSON.stringify(s));render()};el.appendChild(b)})}render();</script></html>
