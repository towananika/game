<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c27"><title>LIFE HOURS — Living World</title><meta name="description" content="観測者から一人の人間へ。ソウルで人生を生き、世界に何かを残すシミュレーション。"><style>
:root{color-scheme:dark;--bg:#121925;--panel:#202b3c;--text:#f3f1e9;--muted:#aebbc9;--gold:#f6d58d;--line:#ffffff25}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}#app{max-width:720px;margin:auto;min-height:100dvh;padding:16px 14px 45px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;letter-spacing:.12em;font-size:20px}.small{color:var(--muted);font-size:12px}.badge{background:#34495c;border:1px solid var(--line);border-radius:30px;padding:5px 10px;font-size:12px}h1{font-size:25px;margin:18px 0 3px}p{margin:5px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.map{position:relative;width:100%;aspect-ratio:1.25;max-height:500px;border:2px solid #455c6d;border-radius:18px;overflow:hidden;background:#6e9a7e;touch-action:manipulation;isolation:isolate}.road{position:absolute;background:#c5c1ac;border:2px solid #aaa995}.road.h{height:16%;left:0;right:0;top:43%}.road.v{width:16%;top:0;bottom:0;left:43%}.bld{position:absolute;border-radius:8px;background:#f0d6b0;border:4px solid #bd9d7d;box-shadow:inset 0 -9px #d6b48c,3px 5px #0002;display:flex;align-items:center;justify-content:center;color:#453f37;font-size:clamp(11px,3vw,17px);font-weight:800;text-align:center}.park{background:#b1d39d;border-color:#77996a}.station{background:#a4c6dd;border-color:#628da8}.home{background:#e8c3cc;border-color:#bb8b9a}.person{position:absolute;z-index:4;transform:translate(-50%,-50%);width:34px;height:43px;text-align:center;filter:drop-shadow(1px 3px 1px #0006);transition:left .5s linear,top .5s linear}.face{display:block;margin:auto;width:28px;height:28px;border:3px solid #473f3a;border-radius:50%;background:#ffe3c1;font-size:17px;line-height:23px}.shirt{display:block;margin:-2px auto 0;width:23px;height:15px;border-radius:8px 8px 3px 3px}.person.you .face{outline:3px solid #ffe392}.person label{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#1a283bcc;padding:1px 5px;border-radius:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid #ffffff35;background:#34465b;color:white;border-radius:12px;padding:11px 14px;font-weight:700}.btn.primary{background:#e7bf75;color:#25231e}.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}.row{display:flex;gap:8px;flex-wrap:wrap}.log{max-height:230px;overflow:auto;padding:0;margin:8px 0;list-style:none}.log li{padding:9px 3px;border-bottom:1px solid #ffffff17;font-size:13px}.log time{color:#d9bb81;font-size:11px;margin-right:7px}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.npc{border:1px solid #ffffff20;border-radius:10px;padding:8px;background:#ffffff08;font-size:12px}.npc b{font-size:14px}.npc span{display:block;color:var(--muted)}.hidden{display:none}.story{font-size:14px;line-height:1.8}.footer{margin-top:22px;color:var(--muted);font-size:11px}.overlay{position:fixed;inset:0;background:#090e16ed;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{max-width:430px;width:100%;background:#233044;border:1px solid #d7b77b;border-radius:22px;padding:24px}.modal h2{margin:0 0 8px}.modal button{margin-top:10px}.hint{color:#e3c890;font-size:12px}

/* Mobile readability patch v0.5 */
:root{color-scheme:light;--bg:#f5f7f6;--panel:#ffffff;--text:#172735;--muted:#526576;--gold:#9c6115;--line:#c5d1d7}
body{font-size:17px;line-height:1.65;background:var(--bg);color:var(--text)}
#app{padding:16px 16px 52px;max-width:780px}
.brand{font-size:23px;letter-spacing:.04em;color:#173f52}
.small{font-size:14px;color:#455e70}
.badge{font-size:14px;background:#e5f0e9;color:#20563e;border-color:#b5d0c0;font-weight:800}
h1{font-size:clamp(25px,6vw,34px);line-height:1.35;margin:20px 0 9px}
h3{font-size:21px;margin:22px 0 10px}
.stats{gap:10px}
.stat,.card{background:#fff;border:2px solid #cbd7dd;box-shadow:0 2px 8px #243c4510}
.stat{padding:12px 9px}
.stat b{font-size:clamp(19px,5vw,25px);color:#173b4f}
.stat span{font-size:13px;color:#3b5362}
.map{aspect-ratio:1.05;max-height:600px;border:3px solid #638b86;background:#83ae8a;box-shadow:0 5px 20px #1c454020}
.bld{font-size:clamp(13px,3.4vw,20px);border-width:3px;color:#352d2b}
.person{width:46px;height:54px;z-index:5;filter:drop-shadow(1px 3px 2px #0008)}
.face{width:38px;height:38px;line-height:32px;font-size:23px;border-width:3px;background:#fff1d9}
.shirt{width:30px;height:17px}
.person label{font-size:13px;font-weight:900;top:-21px;color:#fff;background:#172b3fe8;padding:1px 6px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.btn{font-size:16px;min-height:53px;padding:12px 10px;background:#e9f0f3;color:#193747;border:2px solid #b4c8d0;border-radius:13px}
.btn.primary{background:#f5cf80;color:#3a2c12;border-color:#dba84e}
.btn:disabled{color:#65747c}
.people{gap:9px}
.npc{background:#f0f5f6;border:1px solid #c6d6da;padding:11px;font-size:14px}
.npc b{font-size:17px}
.npc span{color:#486070}
.log li{font-size:15px;border-color:#d2dce0;padding:11px 2px}
.log time{font-size:13px;color:#7c4a0c;font-weight:800}
.story{font-size:16px}
.hint{color:#835518;font-size:13px}
.footer{font-size:12px;color:#536777}
.overlay{background:#17232bcf}
.modal{background:#fff;color:#1c3040;border:2px solid #c49a51;box-shadow:0 16px 60px #0004}
.modal h2{font-size:23px}
@media(max-width:380px){#app{padding-left:10px;padding-right:10px}.brand{font-size:20px}.btn{font-size:14px}.stat span{font-size:12px}.person{width:42px;height:51px}.face{width:35px;height:35px;font-size:21px;line-height:30px}}
</style></head><body><a href="./charge.html" style="display:block;max-width:520px;margin:12px auto;padding:14px 18px;border-radius:14px;background:#283a48;color:#fff;text-decoration:none;font:600 16px system-ui,sans-serif;text-align:center">🔋 CHARGE SHOP — スマホ充電ゲームを開く →</a><main id="app"><header class="head"><div class="brand">LIFE HOURS <span class="small">/ Living World</span></div><span class="badge" id="mode">観測者</span></header><h1 id="heading">街は、あなたがいなくても生きている。</h1><p class="small" id="subtitle">ソウル・望遠洞をモデルにした架空の小さな街。人々の人生を見守ろう。</p><section class="stats"><div class="stat"><b id="day">1日目</b><span>世界の時間</span></div><div class="stat"><b id="population">10人</b><span>住人</span></div><div class="stat"><b id="bonds">0</b><span>つながり</span></div></section><div class="map" id="map" aria-label="住人が暮らす街のマップ"><div class="road h"></div><div class="road v"></div><div class="bld home" style="left:4%;top:5%;width:34%;height:31%">🏠 住宅街</div><div class="bld" style="left:62%;top:5%;width:34%;height:31%">☕ カフェ</div><div class="bld park" style="left:4%;top:64%;width:34%;height:31%">🌳 公園</div><div class="bld station" style="left:62%;top:64%;width:34%;height:31%">🚇 駅</div></div><div class="tabs"><button class="btn primary" id="next">1日観測 ▶</button><button class="btn" id="week">7日観測 ⏩</button><button class="btn" id="born">この世界に生まれる</button><button class="btn" id="save">保存</button></div><section class="card" id="life" hidden><b>あなたの人生</b><div id="lifeinfo" class="story"></div><div class="row" id="actions"><button class="btn" data-act="work">💼 働く</button><button class="btn" data-act="talk">💬 交流する</button><button class="btn" data-act="rest">🌿 休む</button><button class="btn" data-act="learn">📚 学ぶ</button></div><p class="hint">寿命は表示されません。行動には時間がかかります。</p></section><h3>街の住人</h3><div class="people" id="people"></div><h3>世界で起きたこと</h3><ul class="log" id="log"></ul><div class="row"><button class="btn" id="reset">新しい世界を始める</button></div><p class="footer">v0.5 / AI連携前の自律シミュレーション試作。地図・人物・経済は架空です。実際のソウルの統計ではありません。保存はこの端末のブラウザ内のみ。</p></main><div id="overlay" class="overlay hidden"></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),names=['ミナ','ジュン','ソラ','ハル','ジウ','ユナ','テオ','ナリ','ダオン','スビン'],jobs=['学生','店員','デザイナー','運転手','料理人','教師','技術者','看護師','配達員','自営業'],colors=['#c7778a','#79a3d6','#a889d5','#8bb784','#e1a76b','#72b9af'];
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function init(){return {day:1,people:names.map((name,i)=>({id:i,name,age:17+rand(45),job:jobs[i],x:12+rand(76),y:12+rand(76),mood:40+rand(40),money:30+rand(70),skill:rand(20),mem:[],relations:{},alive:true,color:colors[i%colors.length]})),logs:[{day:1,msg:'望遠洞の小さな街で、それぞれの生活が始まった。'}],player:null,legacy:null,after:0}}
let s;try{s=JSON.parse(localStorage.getItem('life-hours-v04'))||init()}catch(e){s=init()}
function note(msg){s.logs.unshift({day:s.day,msg});s.logs=s.logs.slice(0,100)}
function save(){try{localStorage.setItem('life-hours-v04',JSON.stringify(s))}catch(e){}}
function person(id){return s.people.find(p=>p.id===id)}
function move(p){let dest=pick([[20,22],[80,22],[20,80],[80,80],[50,50]]);p.x=Math.max(8,Math.min(92,dest[0]+rand(18)-9));p.y=Math.max(8,Math.min(92,dest[1]+rand(18)-9))}
function encounter(a,b){if(!b||a.id===b.id||!b.alive)return;let v=(a.relations[b.id]||0)+(1+rand(7));a.relations[b.id]=v;b.relations[a.id]=(b.relations[a.id]||0)+2+rand(4);if(v>=20&&v<27)note(a.name+'と'+b.name+'が親しくなった。');if(v>=60&&v<68&&Math.random()<.3)note(a.name+'と'+b.name+'の間に特別な絆が生まれた。')}
function worldDay(){s.day++;for(const p of s.people){if(!p.alive)continue;move(p);const action=rand(5);if(action===0){p.money+=4+rand(10);p.mood-=2;if(Math.random()<.06)note(p.name+'が仕事で新しい機会を得た。')}if(action===1){p.mood=Math.min(100,p.mood+7);if(Math.random()<.08)note(p.name+'が公園で穏やかな午後を過ごした。')}if(action===2){encounter(p,pick(s.people.filter(q=>q.alive&&q.id!==p.id)))}if(action===3){p.skill+=1+rand(3);if(p.skill%20<3&&Math.random()<.15)note(p.name+'が新しい技術を身につけた。')}if(action===4){p.money=Math.max(0,p.money-3);p.mood+=2}p.mood=Math.max(0,Math.min(100,p.mood));if(s.day%365===0){p.age++;if(p.age>65&&Math.random()<(p.age-60)/150){p.alive=false;note(p.name+'が人生を終えた。街にはその人の記憶が残る。')}}}if(s.player&&person(s.player.id)?.alive===false){s.legacy={...s.player,age:person(s.player.id).age,day:s.day};s.after=0;note('あなたの人生が終わった。世界はその後も続いていく。')}if(s.day%7===0){let alive=s.people.filter(p=>p.alive);if(alive.length>1){let a=pick(alive),b=pick(alive.filter(x=>x.id!==a.id));if(a&&b&&Math.random()<.5)note(a.name+'が'+b.name+'の近況を気にかけている。')}}}
function progress(n){for(let i=0;i<n;i++)worldDay();save();render()}
function born(){if(s.player||s.legacy)return;let p=pick(s.people.filter(p=>p.alive));if(!p)return;let bornName='あなた';let id=Math.max(...s.people.map(x=>x.id))+1;let you={id,name:bornName,age:0,job:'子ども',x:20+rand(60),y:20+rand(60),mood:65,money:0,skill:0,mem:[],relations:{},alive:true,color:'#efca83'};s.people.push(you);s.player={id,actions:[],birth:s.day};note('この街に一人の子どもが生まれた。未来はまだ誰にもわからない。');progress(365*16);show('あなたは、この街に生まれた。','どんな家に生まれるか、誰と出会うか、何歳まで生きるかは選べない。ここから先は、あなたの人生だ。')}
function act(type){if(!s.player||s.legacy)return;let p=person(s.player.id);if(!p||!p.alive)return;let msg='';if(type==='work'){p.money+=8+Math.floor(p.skill/5);p.mood=Math.max(0,p.mood-8);msg='あなたは働き、生活のためのお金を得た。'}if(type==='talk'){let q=pick(s.people.filter(x=>x.alive&&x.id!==p.id));if(q){encounter(p,q);msg='あなたは'+q.name+'と時間を過ごした。'}}if(type==='rest'){p.mood=Math.min(100,p.mood+18);msg='あなたは少し休み、自分の時間を取り戻した。'}if(type==='learn'){p.skill+=4;msg='あなたは新しいことを学んだ。'}s.player.actions.push({day:s.day,type,msg});note(msg);progress(1)}
function show(title,msg){$('overlay').classList.remove('hidden');$('overlay').innerHTML='<div class="modal"><h2>'+escape(title)+'</h2><p class="story">'+escape(msg)+'</p><button class="btn primary" id="close">続ける</button></div>';$('close').onclick=()=>$('overlay').classList.add('hidden')}
function render(){let alive=s.people.filter(p=>p.alive);$('day').textContent=(s.day).toLocaleString()+'日目';$('population').textContent=alive.length+'人';$('bonds').textContent=s.people.reduce((a,p)=>a+Object.values(p.relations).filter(v=>v>=20).length,0)/2|0;$('mode').textContent=s.legacy?'人生の余韻':s.player?'住人':'観測者';$('heading').textContent=s.legacy?'あなたがいなくなった街':s.player?'限られた時間を、どう生きる？':'街は、あなたがいなくても生きている。';$('subtitle').textContent=s.legacy?'あなたがいなくなっても、住人たちは生き続ける。':s.player?'他の住人も、自分の意思で暮らしている。':'住人たちは、あなたが見ていない間も人生を重ねている。';$('born').disabled=!!s.player||!!s.legacy;$('born').textContent=s.player?'この世界に生きている':s.legacy?'人生を終えた':'この世界に生まれる';$('map').querySelectorAll('.person').forEach(x=>x.remove());for(let p of alive){let el=document.createElement('div');el.className='person'+(s.player&&s.player.id===p.id?' you':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.innerHTML='<label>'+escape(p.name)+'</label><span class="face">'+(p.age<14?'🧒':p.age>65?'👵':'🙂')+'</span><span class="shirt" style="background:'+p.color+'"></span>';el.onclick=()=>show(p.name+' / '+p.age+'歳',p.job+'。気分 '+p.mood+'。関わりのある人：'+Object.values(p.relations).filter(v=>v>=20).length+'人。');$('map').appendChild(el)}$('people').innerHTML=alive.map(p=>'<div class="npc"><b>'+escape(p.name)+'</b> '+p.age+'歳<span>'+escape(p.job)+' ・ 気分 '+p.mood+' ・ 交流 '+Object.values(p.relations).filter(v=>v>=20).length+'</span></div>').join('');$('log').innerHTML=s.logs.slice(0,22).map(l=>'<li><time>'+l.day+'日</time>'+escape(l.msg)+'</li>').join('');$('life').hidden=!s.player&&!s.legacy;if(s.player){let p=person(s.player.id);$('lifeinfo').textContent=s.legacy?'あなたが残した行動：'+s.player.actions.length+'回。亡くなった後も、街の人々は生活を続けている。':p?'年齢 '+p.age+'歳 / 所持金 '+p.money+'（ゲーム内単位） / 気分 '+p.mood+' / 学び '+p.skill:''}$('actions').hidden=!!s.legacy;$('next').textContent=s.legacy?'1日後を見る ▶':'1日観測 ▶';$('week').textContent=s.legacy?'7日後を見る ⏩':'7日観測 ⏩'}
$('next').onclick=()=>progress(1);$('week').onclick=()=>progress(7);$('born').onclick=born;$('save').onclick=()=>{save();show('保存しました','このブラウザに世界の状態を保存しました。')};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('reset').onclick=()=>show('新しい世界を始める？','現在の世界の記録は消えます。続けるには下の「新しい世界」を選んでください。');$('reset').addEventListener('click',()=>{let modal=$('overlay').querySelector('.modal');let b=document.createElement('button');b.className='btn';b.textContent='新しい世界';b.onclick=()=>{s=init();save();$('overlay').classList.add('hidden');render()};modal.appendChild(b)});render();
})();
</script></body></html>
