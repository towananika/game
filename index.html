<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="名前のない声">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>名前のない声 — TRIATHLON</title>
<meta name="description" content="ひとりの一生に、10年ごとにひとことだけささやくスマホゲーム。">
<style>
  :root{--bg:#0e1116;--glass:#ffffff12;--glass2:#ffffff1f;--line:#ffffff22;--text:#f4f0e8;--muted:#a3adb5;
        --gold:#ffcf6e;--wood:#e0b07c;--sage:#8fe0a8;--water:#7fc4ff;--yume:#c39bff;--red:#ff6b7f}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:manipulation}
  body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
  #app{position:relative;width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  /* 背景（世界ごとに変わる） */
  .bg{position:absolute;inset:0;transition:background 1.4s;z-index:0}
  .bg.utsutsu{background:radial-gradient(120% 60% at 50% 18%,#3b5b74 0%,#1a2733 55%,#0e1116 100%)}
  .bg.yume{background:radial-gradient(120% 60% at 50% 18%,#5b3b8a 0%,#24183f 55%,#0e0b18 100%)}
  .bg.toko{background:radial-gradient(120% 60% at 50% 18%,#b9c4cc 0%,#4a5560 55%,#14181c 100%)}
  .parts{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .parts i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.0;animation:twk 4s infinite}
  @keyframes twk{50%{opacity:.7}}

  /* 上のバー */
  .top{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px}
  .pill{font-size:13px;font-weight:800;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 11px;backdrop-filter:blur(8px)}
  .sp{flex:1}
  .ib{width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
  .track{position:relative;z-index:2;margin:0 14px;height:8px;border-radius:4px;display:flex;overflow:hidden;background:#0006}
  .track b{display:block;height:100%}
  .track .r{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;transition:left 1.6s cubic-bezier(.3,.8,.3,1)}
  .track-wrap{position:relative;z-index:2;padding:6px 0 0}

  /* 立ち絵とネームプレート */
  .stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
  .aura{position:absolute;left:50%;bottom:14%;width:120%;aspect-ratio:1;transform:translateX(-50%);
    background:radial-gradient(closest-side,#ffffff30,#ffffff00);pointer-events:none}
  .por{position:relative;height:100%;max-height:430px;aspect-ratio:200/244;transition:transform .5s cubic-bezier(.3,1.4,.5,1),filter 1s}
  .por svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px #000a)}
  .por.bump{transform:scale(1.04)}
  .por.dead{filter:grayscale(.8) brightness(1.2) opacity(.55)}
  .plate{position:absolute;left:14px;right:14px;bottom:10px;z-index:3;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
  .plate .nm{flex:1;min-width:0}
  .plate .stars{color:var(--gold);font-size:14px;letter-spacing:1px;text-shadow:0 0 8px #ffb000aa}
  .plate h2{font-size:26px;font-weight:900;letter-spacing:.04em;line-height:1.15;text-shadow:0 2px 12px #000,0 0 2px #000;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plate .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:11px;font-weight:800;background:#000a;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .emb{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:linear-gradient(145deg,#ffffff30,#ffffff08);border:1px solid var(--line);box-shadow:0 4px 14px #0008}
  .think{position:absolute;right:12%;top:8%;z-index:3;font-size:30px;background:#fff;border-radius:50%;width:58px;height:58px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0008;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
  .think:after{content:"";position:absolute;left:4px;bottom:-6px;width:14px;height:14px;border-radius:50%;background:#fff}
  .think.on{transform:scale(1)}
  .talk{position:absolute;left:14px;right:30%;top:16%;z-index:5;background:#fffffff2;color:#1b1f26;border-radius:18px 18px 18px 4px;
    padding:10px 14px;font-size:15px;font-weight:800;line-height:1.5;box-shadow:0 8px 24px #0009;transform:scale(0);transform-origin:left bottom;
    transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .talk.on{transform:scale(1)}
  .talk small{display:block;font-size:10px;color:#7a8490;font-weight:900;letter-spacing:.1em}
  .bond{font-size:12px;letter-spacing:1px;margin-left:6px;color:#ff8fb1;text-shadow:0 0 6px #ff4f8b88}
  .card .last{font-size:14px;font-weight:700;line-height:1.7;background:#ffffff14;border-radius:14px;padding:10px 12px;margin:10px 0;color:#fff}
  .card .last small{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em}
  .fly{position:absolute;z-index:4;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 8px #000;animation:fly 1.6s ease-out forwards}
  @keyframes fly{0%{opacity:0;transform:translateY(16px) scale(.5)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-80px)}}

  /* 下のパネル */
  .panel{position:relative;z-index:2;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(180deg,#0e111600,#0e1116ee 18%);display:flex;flex-direction:column;gap:10px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .st{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px 0 6px;text-align:center;transition:box-shadow .2s,transform .2s,border-color .2s}
  .st b{display:block;font-size:18px;line-height:1.2}
  .st small{display:block;font-size:11px;font-weight:800;color:var(--muted)}
  .st.glow{border-color:var(--gold);box-shadow:0 0 0 2px #ffcf6e55,0 0 16px #ffcf6e88;transform:translateY(-3px)}
  .st.up small{color:var(--sage)}
  .moments{display:flex;gap:8px;min-height:62px}
  .m{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:7px 8px;
    opacity:0;transform:translateY(10px);animation:in .45s ease forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .m b{font-size:24px}
  .m span{font-size:10.5px;line-height:1.35;color:#dfe5ea;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .m em{display:block;font-style:normal;font-size:10px;font-weight:900;color:var(--gold)}
  .choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ch{position:relative;height:76px;border-radius:20px;border:1px solid var(--line);color:var(--text);font:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s,box-shadow .2s;touch-action:manipulation}
  .ch b{font-size:30px;line-height:1}
  .ch span{font-size:12px;font-weight:900}
  .ch.a{background:linear-gradient(160deg,#8a4fff,#4a2a9a)}
  .ch.f{background:linear-gradient(160deg,#ff9a5a,#a8482a)}
  .ch.s{background:linear-gradient(160deg,#45a8ff,#1f5aa8)}
  .ch.w{background:linear-gradient(160deg,#5a6672,#2c343c)}
  .ch.press{transform:scale(.92);box-shadow:0 0 0 3px #fff8}
  .ch:disabled{opacity:.35}
  .hold{position:absolute;left:10%;right:10%;bottom:7px;height:3px;border-radius:2px;background:#fff;transform:scaleX(0);transform-origin:left}
  .ch.press .hold{transition:transform .35s linear;transform:scaleX(1)}
  .hint{text-align:center;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}

  /* 全画面のシート */
  .sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:#000c;backdrop-filter:blur(6px)}
  .sheet.on{display:flex}
  .card{position:relative;width:100%;max-width:360px;border-radius:26px;padding:18px 18px 20px;text-align:center;overflow:hidden;
    background:linear-gradient(160deg,#2c3542,#141920);border:2px solid var(--gold);box-shadow:0 0 40px #ffcf6e44;animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
  .card .pic{width:150px;margin:0 auto -6px}
  .card h3{font-size:22px;font-weight:900;margin-top:6px}
  .card .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .card .rib{display:inline-block;margin:12px 0 4px;font-size:15px;font-weight:900;color:#1a1208;background:linear-gradient(90deg,#ffe29a,#ffb84a);padding:6px 16px;border-radius:999px;box-shadow:0 4px 14px #ffb84a66}
  .row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
  .chip{font-size:12px;font-weight:800;background:#0005;border:1px solid var(--line);border-radius:10px;padding:5px 9px}
  .feel{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}
  .feel small{font-size:12px;color:var(--muted);font-weight:800}
  .feel button{font-size:26px;background:#ffffff14;border:1px solid var(--line);border-radius:14px;width:48px;height:48px}
  .feel .fb{font-size:13px;font-weight:900;color:#1a1208;background:#ffcf6e;border-radius:10px;padding:6px 10px;text-decoration:none}
  .lifebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 14px}
  .btns{display:flex;gap:8px}
  .btn{flex:1;font:inherit;font-size:16px;font-weight:900;border:none;border-radius:16px;padding:14px 8px;color:#1a1208;background:linear-gradient(180deg,#ffe29a,#ffb84a);box-shadow:0 4px 0 #b87a20}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b87a20}
  .btn.sec{color:var(--text);background:#ffffff22;box-shadow:0 4px 0 #0008}
  .burst{position:absolute;inset:-40%;background:conic-gradient(from 0deg,#ffcf6e00,#ffcf6e55,#ffcf6e00 20%,#ffcf6e55 30%,#ffcf6e00 40%,#ffcf6e55 50%,#ffcf6e00 60%,#ffcf6e55 70%,#ffcf6e00 80%,#ffcf6e55 90%,#ffcf6e00);
    animation:spin 8s linear infinite;pointer-events:none;opacity:.6}
  @keyframes spin{to{transform:rotate(360deg)}}
  .card > *:not(.burst){position:relative}
  .dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .dex div{background:#0005;border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:24px}
  .dex div small{display:block;font-size:9.5px;font-weight:800;color:var(--muted);margin-top:2px;line-height:1.2}
  .dex div.no{opacity:.35;filter:grayscale(1)}

  /* タイトル */
  .title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(120% 80% at 50% 25%,#3b4d6a,#0e1116 70%)}
  .title.hide{display:none}
  .title .duo{display:flex;gap:0;margin-bottom:-6px}
  .title .duo div{width:130px}
  .title h1{font-size:30px;font-weight:900;letter-spacing:.18em;text-shadow:0 0 20px #7fc4ff88}
  .title p{color:var(--muted);font-size:14px;line-height:1.8}
  .title .btn{width:240px;flex:none}
  .title a.btn{text-decoration:none;display:block}
  .title small{font-size:12px;color:var(--muted);max-width:280px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div class="bg utsutsu" id="bg"></div>
  <div class="parts" id="parts"></div>
  <div class="top">
    <span class="pill" id="age"></span>
    <span class="pill" id="money"></span>
    <span class="sp"></span>
    <button class="ib" id="snd" aria-label="音">🔊</button>
    <button class="ib" id="dexBtn" aria-label="図鑑">🎀</button>
    <button class="ib" id="menuBtn" aria-label="メニュー">☰</button>
  </div>
  <div class="track-wrap"><div class="track" id="track"><b style="flex:80;background:linear-gradient(90deg,#8fe0a8,#e0b07c)"></b><b id="tk2" style="flex:12;background:#c39bff;opacity:.3"></b><b id="tk3" style="flex:8;background:#d9e1e6;opacity:.3"></b><span class="r" id="runner"></span></div></div>
  <div class="stage" id="stage">
    <div class="aura"></div>
    <div class="por" id="por"></div>
    <div class="think" id="think"></div>
    <div class="talk" id="talk"></div>
    <div class="plate">
      <div class="nm"><div class="stars"><span id="stars"></span><span class="bond" id="bond"></span></div><h2 id="name"></h2><div class="tags" id="tags"></div></div>
      <div class="emb" id="emb"></div>
    </div>
  </div>
  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="moments" id="moments"></div>
    <div class="choices" id="choices"></div>
    <div class="hint" id="hint">長押しでささやく ・ ふれると影響が光る</div>
  </div>
</div>
<div class="sheet" id="sheet"></div>
<div class="title" id="title">
  <div class="duo" id="duo"></div>
  <h1>名前のない声</h1>
  <p>10年にひとこと。<br>ひとりの一生を見届ける。</p>
  <button class="btn" id="go">▶ はじめる</button>
  <a class="btn sec" href="./arcade/">🎮 ミニゲーム</a>
  <small id="fsHint"></small>
</div>
<script src="./mini/engine.js"></script>
<script src="./mini/portrait.js"></script>
<script src="./mini/bgm.js"></script>
<script>
(function(){
  var T = window.TRI, KEY = 'tri-mini-v3', DEX = 'tri-ribbons', s = null, busy = false;
  var $ = function(id){ return document.getElementById(id); };
  function buzz(n){ try{ navigator.vibrate && navigator.vibrate(n); }catch(e){} }
  // 計測：KPI（WEB_BACKLOG.md）。いまは端末内に記録だけ。数える先（GoatCounter など）が決まったら COUNT_URL に入れる
  // GoatCounter のコード（例 'towananika'）と Google フォームのURL。ユーザーから届いたら入れる
  var GC_CODE = '', FORM_URL = '';
  var COUNT_URL = GC_CODE ? 'https://' + GC_CODE + '.goatcounter.com/count' : '';
  function track(ev){
    try{
      var k = 'tri-kpi', d = JSON.parse(localStorage.getItem(k) || '{}'), day = new Date().toISOString().slice(0,10);
      if (!d.first) d.first = day;
      d.days = d.days || {}; d.days[day] = 1; d[ev] = (d[ev] || 0) + 1; localStorage.setItem(k, JSON.stringify(d));
      if (COUNT_URL) (new Image()).src = COUNT_URL + '?p=/ev/' + ev + '&t=' + ev + '&rnd=' + Math.random();
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function load(){ try{ var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hero(){ return s.chars[s.heroId]; }
  function short(t){ t = String(t).split('。')[0]; return t.length > 26 ? t.slice(0,25) + '…' : t; }

  // ささやき：ふれると影響する能力が光る（Reigns のゲージ予告）
  var CHOICE = [
    {k:'adventure', c:'a', i:'⚔️', n:'冒険', say:'ぼうけんしよう', hit:['body','heart'], yume:true},
    {k:'family',    c:'f', i:'🏠', n:'家族', say:'家族をだいじに', hit:['people','heart']},
    {k:'study',     c:'s', i:'📚', n:'学び', say:'まなぼう', hit:['know','craft']},
    {k:'watch',     c:'w', i:'👁️', n:'見守る', say:'……', hit:[]}];
  var STAT = [['body','💪','体'],['know','🧠','知'],['craft','🔧','技'],['people','🤝','人'],['heart','❤️','心']];
  var ICON = {kiri:'🏝️',voice:'🗣️',dreamDone:'🌟',voiceEcho:'🔔',friend:'🤝',parentDeath:'🕯️',marriage:'💍',birth:'👶',birthMore:'👶',
    succession:'🔑',path:'🎓',crisis:'⚠️',heir:'🔑',firstYume:'🌀',job:'💼',retire:'🪑',card:'🃏',ability:'⬆️',dream:'✨'};
  var CLASS = {R:'🛡️',G:'🏹',B:'🔮'};
  var THINK = {work:'💼',study:'📖',yume:'🌀',play:'🎮',rest:'😴'};
  // リボン（称号）：一生の終わりに1つ。図鑑に集まる（BitLife / Reigns）
  var RIBBON = [
    ['kiri','🏝️','霧の島を見た'], ['dream','🌟','夢をかなえた'], ['long','🕊️','百寿の旅人'], ['yume','🌀','ゆめの住人'],
    ['trust','🗣️','声を信じた'], ['free','🦅','自分で決めた'], ['scholar','📚','学びの人'], ['worker','💼','働き者'],
    ['family','💍','家族の灯'], ['play','🎮','遊びの達人'], ['short','🌱','早すぎた別れ'], ['plain','🍃','おだやかな一生']];

  function stars(h){ var a = h.aptitude, t = a.body + a.mind + a.hands + a.sense + a.voice; return t > 3.2 ? 5 : t > 2.85 ? 4 : t > 2.4 ? 3 : t > 2 ? 2 : 1; }
  function dom(h){ var b = h.battle, r = b.atk+b.def+b.hp, g = b.ran+b.ats+b.spd, bl = b.mag+b.res+b.mp; return r >= g && r >= bl ? 'R' : g >= bl ? 'G' : 'B'; }
  function age(h){ return h.alive ? h.age : h.diedAt; }

  function ribbons(h){
    var c = h.life.counts || {}, tot = 0, k, sc = h.life.scenes || [], got = [];
    for (k in c) tot += c[k];
    function share(a){ return tot ? (c[a] || 0) / tot : 0; }
    function has(kind){ return sc.some(function(x){ return x.kind === kind; }); }
    if (has('kiri')) got.push('kiri');
    if (has('dreamDone')) got.push('dream');
    if (h.diedAt >= 95) got.push('long');
    if (share('yume') > .22) got.push('yume');
    if (h.voice.trust >= .6) got.push('trust');
    if (h.voice.trust <= .15) got.push('free');
    if (share('study') > .28) got.push('scholar');
    if (share('work') > .42) got.push('worker');
    if (has('marriage')) got.push('family');
    if (share('play') > .35) got.push('play');
    if (h.diedAt < 50) got.push('short');
    if (!got.length) got.push('plain');
    return got;
  }
  function dexLoad(){ try{ return JSON.parse(localStorage.getItem(DEX) || '{}'); }catch(e){ return {}; } }
  function dexSave(d){ try{ localStorage.setItem(DEX, JSON.stringify(d)); }catch(e){} }

  function particles(){
    var p = $('parts'), h = '';
    for (var i = 0; i < 26; i++) h += '<i style="left:' + Math.random()*100 + '%;top:' + Math.random()*60 + '%;animation-delay:' + Math.random()*4 + 's"></i>';
    p.innerHTML = h;
  }

  function drawAll(prev){
    var h = hero(), a = age(h);
    $('age').textContent = a + '歳';
    $('money').textContent = '🪙 ' + Math.max(0, Math.round(s.vault.money));
    $('runner').style.left = (h.alive ? Math.min(79, Math.max(2, a * 0.8)) : 96) + '%';
    $('tk2').style.opacity = h.life.avatar ? 1 : .3;
    $('tk3').style.opacity = h.alive ? .3 : 1;
    var yume = h.alive && h.life.avatar && (h.life.counts.yume || 0) > 8;
    var world = !h.alive ? 'toko' : yume ? 'yume' : 'utsutsu';
    $('bg').className = 'bg ' + world; BGM.mode(world);
    $('por').innerHTML = Portrait(h, 'm');
    $('por').classList.toggle('dead', !h.alive);
    $('stars').textContent = '★★★★★'.slice(0, stars(h)) + '☆☆☆☆☆'.slice(0, 5 - stars(h));
    $('name').textContent = h.name;
    var bn = Math.round(h.voice.trust * 5); $('bond').textContent = '♥'.repeat(bn) + '♡'.repeat(5 - bn);
    var tags = [T.cities.byId(h.birthCity).name];
    (h.dreams || []).slice(0,1).forEach(function(d){ tags.push('✨ ' + d.text); });
    if (h.life.job) tags.push(h.life.job.ja);
    $('tags').innerHTML = tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    $('emb').textContent = h.life.avatar ? CLASS[h.life.job ? h.life.job.color : dom(h)] : '🌱';
    $('stats').innerHTML = STAT.map(function(x){
      var v = Math.round(h.ability[x[0]] * 100), up = prev && v > Math.round(prev[x[0]] * 100);
      return '<div class="st' + (up ? ' up' : '') + '" data-s="' + x[0] + '"><b>' + x[1] + '</b><small>' + v + '</small></div>';
    }).join('');
  }

  function drawMoments(list){
    $('moments').innerHTML = (list || []).map(function(x, i){
      return '<div class="m" style="animation-delay:' + (0.2 + i*0.35) + 's"><b>' + (ICON[x.kind] || '✨') + '</b><div><em>' + x.age + '歳</em><span>' + esc(short(x.text)) + '</span></div></div>';
    }).join('');
  }

  function think(icon){
    var t = $('think'); t.textContent = icon; t.classList.add('on');
    setTimeout(function(){ t.classList.remove('on'); }, 2600);
  }

  // 1対1の物語：キャラが声に返事をする（オフラインでも満足を）
  var LINES = {
    kid:   {yes:['えへへ、たのしかった！','また、おしえてね。','ねえ、あなたはだれ？'], no:['やだ、こっちがいい！','しらないもん。'], watch:['……だれかいるの？']},
    hi:    {yes:['うん、そうしてみた。','あなたの言うとおりだった。','また聞こえたね。ありがとう。'], no:['ごめん、今回は自分で決めた。','わかってる。でも、こっちを選んだ。'], watch:['黙ってても、そばにいるのはわかる。']},
    lo:    {yes:['……たまたま、だよ。','別に、言われたからじゃない。'], no:['誰の声？ ほっといて。','自分の道は自分で決める。'], watch:['静かだね。それでいい。']},
    old:   {yes:['長い付き合いになったね。','あなたの声、年をとらないね。'], no:['この年になると、頑固でね。'], watch:['ふふ、今日は静かだ。']}};
  function talkLine(h, c, followed){
    var a = age(h), set = a < 13 ? LINES.kid : a >= 60 ? LINES.old : h.voice.trust >= .4 ? LINES.hi : LINES.lo;
    var pool = c.k === 'watch' ? set.watch : followed ? set.yes : set.no;
    return pool[(s.mini.episode + a) % pool.length];
  }
  function lastWords(h){
    var t = h.voice.trust;
    return t >= .6 ? 'ずっと、あなたの声が好きだった。またどこかで。' : t >= .3 ? 'あなたが誰だったのか、最後までわからなかった。でも、悪くなかった。' : '自分で決めた一生だった。……でも、ありがとう。';
  }
  function talk(text){
    var el = $('talk'), name = hero().name.split(' ')[1], i = 0;
    el.innerHTML = '<small>' + esc(name) + '</small><span></span>'; el.classList.add('on');
    var sp = el.querySelector('span'), iv = setInterval(function(){ sp.textContent = text.slice(0, ++i); if (i % 2) BGM.sfx('tap'); if (i >= text.length) clearInterval(iv); }, 45);
    clearTimeout(talk.t); talk.t = setTimeout(function(){ el.classList.remove('on'); }, 1800 + text.length * 70);
    el.onclick = function(){ el.classList.remove('on'); };
  }

  function fly(text, color, x, y){
    var f = document.createElement('div'); f.className = 'fly'; f.textContent = text; f.style.color = color || '#fff';
    f.style.left = x + '%'; f.style.top = y + '%'; $('stage').appendChild(f);
    setTimeout(function(){ f.remove(); }, 1700);
  }

  // 長押しで決定（誤タップ防止）。ふれている間は影響する能力が光る
  function drawChoices(){
    var h = hero();
    if (!h.alive){ $('choices').innerHTML = ''; $('hint').textContent = ''; return; }
    $('hint').textContent = '長押しでささやく ・ ふれると影響が光る';
    $('choices').innerHTML = CHOICE.map(function(c){
      return '<button class="ch ' + c.c + '" data-k="' + c.k + '"><b>' + c.i + '</b><span>' + c.n + '</span><i class="hold"></i></button>'; }).join('');
    $('choices').querySelectorAll('.ch').forEach(function(b){
      var c = CHOICE.filter(function(x){ return x.k === b.dataset.k; })[0], timer = null;
      function glow(on){ document.querySelectorAll('.st').forEach(function(el){ el.classList.toggle('glow', on && c.hit.indexOf(el.dataset.s) >= 0); }); $('tk2').style.boxShadow = on && c.yume ? '0 0 12px #c39bff' : ''; }
      function down(e){ if (busy) return; e.preventDefault(); b.classList.add('press'); glow(true); buzz(8); BGM.sfx('hold');
        timer = setTimeout(function(){ b.classList.remove('press'); glow(false); whisper(c); }, 350); }
      function up(){ clearTimeout(timer); b.classList.remove('press'); glow(false); }
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
      b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    });
  }

  function start(seed){
    s = T.state.createWorld(seed);
    s.vault.policy = { allowance:'normal', voice:'watch', decade:true };
    s.mini = { episode:0, last:[] }; track('life');
    save(); drawAll(); drawChoices();
    drawMoments([{age:0, kind:'birth', text:T.cities.byId(hero().birthCity).name + 'で生まれた'}]);
    birthCard();
  }

  // 誕生はガチャのように：光って、星の数が出る
  function birthCard(){
    var h = hero(), n = stars(h);
    $('sheet').innerHTML = '<div class="card">' + (n >= 4 ? '<div class="burst"></div>' : '') +
      '<div class="stars" style="color:var(--gold);font-size:22px;letter-spacing:2px">' + '★★★★★'.slice(0,n) + '</div>' +
      '<div class="pic">' + Portrait(h, 'b') + '</div><h3>' + esc(h.name) + '</h3><div class="sub">' + T.cities.byId(h.birthCity).name + 'に誕生</div>' +
      '<div class="row">' + (h.dreams || []).map(function(d){ return '<span class="chip">✨ ' + esc(d.text) + '</span>'; }).join('') + '</div>' +
      '<div class="btns"><button class="btn" id="ok">🗣️ 見届ける</button></div></div>';
    $('sheet').classList.add('on'); buzz(n >= 4 ? [30,40,60] : 20); BGM.sfx('gacha');
    $('ok').onclick = function(){ $('sheet').classList.remove('on'); };
  }

  function whisper(c){
    if (busy) return; busy = true; buzz([15,30,15]); BGM.sfx('whisper'); track('whisper');
    $('choices').querySelectorAll('.ch').forEach(function(b){ b.disabled = true; });
    think(c.i);
    setTimeout(function(){
      s.vault.policy.voice = c.k;
      var h = hero(), t0 = s.tick, prev = JSON.parse(JSON.stringify(h.ability)), born = h.life.bornTick || 0, c0 = JSON.parse(JSON.stringify(h.life.counts));
      s = T.state.advance(s, 40); h = hero(); s.mini.episode += 1;
      var list = (h.life.scenes || []).filter(function(x){ return x.tick >= t0; })
        .sort(function(a,b){ return b.score - a.score; }).slice(0,3).sort(function(a,b){ return a.tick - b.tick; })
        .map(function(x){ return {kind:x.kind, text:x.text, age:Math.floor((x.tick - born)/4)}; });
      s.mini.last = list; save();
      drawAll(prev); drawMoments(list);
      $('por').classList.add('bump'); setTimeout(function(){ $('por').classList.remove('bump'); }, 500);
      // 数字が飛ぶ（ウマ娘の育成のように）
      STAT.forEach(function(x, i){ var d = Math.round((h.ability[x[0]] - prev[x[0]]) * 100);
        if (d) setTimeout(function(){ fly(x[1] + (d > 0 ? '+' : '') + d, d > 0 ? '#8fe0a8' : '#ff6b7f', 8 + i*18, 55); BGM.sfx(d > 0 ? 'up' : 'down'); if (d > 0) buzz(6); }, 250 + i*160); });
      var best = null, bn = 0; for (var k in h.life.counts){ var dd = h.life.counts[k] - (c0[k] || 0); if (dd > bn){ bn = dd; best = k; } }
      if (best) setTimeout(function(){ think(THINK[best] || '💭'); }, 1200);
      var push = {adventure:['yume','play'], family:['work','rest'], study:['study']}[c.k] || [];
      var line = talkLine(h, c, push.indexOf(best) >= 0);
      if (h.alive) setTimeout(function(){ talk(line); }, 1700);
      setTimeout(function(){ busy = false; drawChoices(); if (!h.alive) setTimeout(endCard, 900); }, 1500);
    }, 650);
  }

  function endCard(){
    var h = hero(), c = h.life.counts || {}, got = ribbons(h), d = dexLoad(), isNew = []; track('finish');
    got.forEach(function(k){ if (!d[k]) isNew.push(k); d[k] = (d[k] || 0) + 1; }); dexSave(d);
    var main = RIBBON.filter(function(r){ return got.indexOf(r[0]) >= 0; })[0];
    var seg = [['work','#e0b07c'],['study','#7fc4ff'],['yume','#c39bff'],['play','#8fe0a8'],['rest','#a3adb5']]
      .map(function(x){ return '<b style="flex:' + (c[x[0]] || 0) + ';background:' + x[1] + '"></b>'; }).join('');
    var others = RIBBON.filter(function(r){ return got.indexOf(r[0]) >= 0 && r !== main; });
    $('sheet').innerHTML = '<div class="card"><div class="burst"></div>' +
      '<div class="pic">' + Portrait(h, 'e') + '</div><h3>' + esc(h.name) + '</h3>' +
      '<div class="sub">' + T.cities.byId(h.birthCity).name + ' ・ ' + h.diedAt + '歳で とこよへ</div>' +
      '<div class="last"><small>最後のひとこと</small>「' + esc(lastWords(h)) + '」</div>' +
      '<div class="rib">' + main[1] + ' ' + main[2] + (isNew.indexOf(main[0]) >= 0 ? '　NEW' : '') + '</div>' +
      '<div class="row">' + others.map(function(r){ return '<span class="chip">' + r[1] + ' ' + r[2] + '</span>'; }).join('') + '</div>' +
      '<div class="lifebar">' + seg + '</div>' +
      '<div class="feel" id="feel"><small>この一生、どうだった？</small><button data-f="good">😊</button><button data-f="ok">😐</button><button data-f="bad">😞</button></div>' +
      '<div class="btns"><button class="btn sec" id="share">📤 共有</button><button class="btn" id="again">👶 次の命</button></div></div>';
    $('sheet').classList.add('on'); buzz([40,60,40,60,120]); BGM.sfx('fanfare');
    $('again').onclick = function(){ $('sheet').classList.remove('on'); start(Date.now() % 100000); };
    $('share').onclick = function(){ track('share'); share(h, main); };
    $('feel').querySelectorAll('button').forEach(function(b){ b.onclick = function(){ track('feel_' + b.dataset.f); BGM.sfx('tap'); buzz(10);
      $('feel').innerHTML = '<small>ありがとう</small>' + b.textContent + (FORM_URL ? ' <a class="fb" target="_blank" rel="noopener" href="' + FORM_URL + '">✍️ ひとこと感想</a>' : ''); }; });
  }

  // 共有（ねこあつめ／BitLife）。対応していなければコピー
  function share(h, main){
    var text = '【名前のない声】' + h.name + '（' + T.cities.byId(h.birthCity).name + '）は ' + h.diedAt + '歳で一生を終えた。' + main[1] + '「' + main[2] + '」';
    var url = location.href.split('#')[0].split('?')[0];
    if (navigator.share) navigator.share({ title:'名前のない声', text:text, url:url }).catch(function(){});
    else { try{ navigator.clipboard.writeText(text + ' ' + url); fly('📋 コピーした', '#fff', 30, 30); }catch(e){} }
  }

  function dexSheet(){
    var d = dexLoad(), n = 0;
    var html = RIBBON.map(function(r){ var on = d[r[0]]; if (on) n++;
      return '<div class="' + (on ? '' : 'no') + '">' + r[1] + '<small>' + (on ? r[2] : '？？？') + '</small></div>'; }).join('');
    $('sheet').innerHTML = '<div class="card"><h3>🎀 リボン図鑑</h3><div class="sub">' + n + ' / ' + RIBBON.length + '</div><div class="dex">' + html + '</div>' +
      '<div class="btns"><button class="btn" id="ok">とじる</button></div></div>';
    $('sheet').classList.add('on');
    $('ok').onclick = function(){ $('sheet').classList.remove('on'); };
  }

  function menuSheet(){
    $('sheet').innerHTML = '<div class="card"><h3>☰ メニュー</h3><div class="btns" style="flex-direction:column;margin-top:14px">' +
      '<button class="btn sec" id="m1">🎮 ミニゲーム</button><button class="btn sec" id="m2">⛶ 全画面</button>' +
      '<button class="btn sec" id="m3">↻ べつの一生をはじめる</button><button class="btn" id="ok">とじる</button></div></div>';
    $('sheet').classList.add('on');
    $('m1').onclick = function(){ location.href = './arcade/'; };
    $('m2').onclick = function(){ goFull(); $('sheet').classList.remove('on'); };
    $('m3').onclick = function(){ $('sheet').classList.remove('on'); start(Date.now() % 100000); };
    $('ok').onclick = function(){ $('sheet').classList.remove('on'); };
  }

  var standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
  var canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function goFull(){
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
    if (f && !document.fullscreenElement) try{ var r = f.call(d, {navigationUI:'hide'}); if (r && r.catch) r.catch(function(){}); }catch(e){}
    try{ screen.orientation.lock('portrait').catch(function(){}); }catch(e){}
  }

  // タイトルには男子と女子をひとりずつ
  (function(){
    var pair = [], i = 1;
    while (pair.length < 2 && i < 60){ var w = T.state.createWorld(i * 31), h = w.chars[w.heroId]; h.age = 17;
      if (!pair.some(function(p){ return p.sex === h.sex; })) pair.push(h); i++; }
    $('duo').innerHTML = pair.map(function(h, j){ return '<div>' + Portrait(h, 't' + j) + '</div>'; }).join('');
  })();
  if (!standalone && !canFS) $('fsHint').textContent = '全画面で遊ぶには：共有ボタン →「ホーム画面に追加」';
  $('snd').textContent = BGM.isOn() ? '🔊' : '🔇';
  $('snd').onclick = function(){ BGM.start(); $('snd').textContent = BGM.toggle() ? '🔊' : '🔇'; };
  document.addEventListener('pointerdown', function(){ BGM.start(); }, {once:true});
  track('open');
  // プレイ時間：画面が見えている間、1分ごとに1つ数える
  setInterval(function(){ if (!document.hidden && $('title').classList.contains('hide')) track('min'); }, 60000);
  $('go').onclick = function(){ track('start'); goFull(); buzz(15); BGM.start(); BGM.sfx('tap'); $('title').classList.add('hide'); if (!s) start(Date.now() % 100000); };
  $('dexBtn').onclick = dexSheet;
  $('menuBtn').onclick = menuSheet;
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  particles();
  s = load();
  if (s && s.mini){ drawAll(); drawMoments(s.mini.last); drawChoices(); }
  if (standalone){ $('title').classList.add('hide'); if (!s) start(Date.now() % 100000); else if (!hero().alive) endCard(); }
})();
</script>
</body>
</html>
